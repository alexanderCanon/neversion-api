name: CI/CD Pipeline - Spring Boot to EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
# ==========================================
# STAGE 1: CONTINUOUS INTEGRATION
# ==========================================
  ci-tests:
    name: Build & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Maven Tests
        run: chmod +x mvnw && ./mvnw test -B
# ==========================================
# STAGE 2: CONTINUOUS DEPLOYMENT
# ==========================================
  cd-deploy:
    name: Deploy to AWS EC2
    needs: ci-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::163053485479:role/GitHubActionsDeployRole
          aws-region: us-east-2

      - name: Auth with Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mi-app-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 via AWS SSM
        env:
          INSTANCE_ID: i-01c173c56307b50b2
        run: |
          cat << 'EOF' > deploy_script.sh
          #!/bin/bash
          set -e
          
          echo "### Authenticating Docker..."
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 163053485479.dkr.ecr.us-east-2.amazonaws.com
          
          echo "### Cloning repository..."
          TOKEN=$(aws ssm get-parameter --name "/prod/backend/GITHUB_TOKEN" --with-decryption --query "Parameter.Value" --output text)
          APP_DIR="/home/ssm-user/app"
          
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone "https://x-access-token:${TOKEN}@github.com/alexanderCanon/panel-neversion.git" "$APP_DIR"
          else
            cd "$APP_DIR" && git pull origin main
          fi
          
          echo "### Fetching SSM Parameters and Generating .env File..."
          cd "$APP_DIR"
          aws ssm get-parameters-by-path --path "/prod/backend/" --with-decryption --query "Parameters[*]" | jq -r '.[] | (.Name | split("/") | last) + "=" + .Value' > .env
          
          echo "### Starting Docker Compose..."
          docker compose -f compose.prod.yaml pull app
          docker compose -f compose.prod.yaml up -d app
          EOF

          jq -n --arg script "$(cat deploy_script.sh)" '{"commands": [$script]}' > ssm_params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm_params.json \
            --query "Command.CommandId" \
            --output text)
            
          echo "Command ID: $COMMAND_ID sent to EC2. Waiting for execution..."
          
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || EXIT_CODE=$?
            
          echo "=== STDOUT ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          
          echo "=== STDERR ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
          
          if [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "Deployment failed with exit code $EXIT_CODE. Check the STDERR above."
            exit ${EXIT_CODE}
          fi