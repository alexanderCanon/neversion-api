name: CD — API

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'compose.prod.yml'
      - '.mvn/**'
      - 'mvnw'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
  ROLE_TO_ASSUME: ${{ secrets.AWS_OIDC_ROLE_ARN }}
  DEPLOY_DIR: ${{ secrets.DEPLOY_APP_DIR }}
  SSM_PARAM_PATH: ${{ secrets.AWS_SSM_PARAM_PATH }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-api-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.export-image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (ARM emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Image URI
        id: export-image
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-via-ssm:
    name: Deploy to EC2 via AWS SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Deployment Commands via SSM
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          COMPOSE_B64=$(base64 -w 0 compose.prod.yml)
          REGISTRY=$(echo "$IMAGE_URI" | cut -d/ -f1)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"set -e\",
              \"aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REGISTRY\",
              \"mkdir -p ${{ env.DEPLOY_DIR }}\",
              \"echo '$COMPOSE_B64' | base64 -d > ${{ env.DEPLOY_DIR }}/compose.prod.yml\",
              \"aws ssm get-parameters-by-path --path ${{ env.SSM_PARAM_PATH }} --with-decryption --query 'Parameters[*].[Name,Value]' --output text | sed 's|^${{ env.SSM_PARAM_PATH }}||; s|\\\t|=|' > ${{ env.DEPLOY_DIR }}/.env\",
              \"chmod 600 ${{ env.DEPLOY_DIR }}/.env\",
              \"cd ${{ env.DEPLOY_DIR }}\",
              \"IMAGE_URI=$IMAGE_URI docker compose -f compose.prod.yml pull\",
              \"IMAGE_URI=$IMAGE_URI docker compose -f compose.prod.yml up -d --remove-orphans\",
              \"echo 'Waiting for Actuator health check...'\",
              \"sleep 15\",
              \"for i in \$(seq 1 10); do if curl -f http://localhost:8080/actuator/health; then echo 'Application is UP'; exit 0; fi; echo 'Waiting for app...'; sleep 5; done; echo 'Health check timed out'; exit 1\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Waiting for SSM command: $COMMAND_ID to finish..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment failed with status: $STATUS" >&2
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text >&2
            exit 1
          fi

          echo "Deployment successful."
