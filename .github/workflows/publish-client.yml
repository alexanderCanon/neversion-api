name: Publish TypeScript API Client to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Generate OpenAPI Specification
        run: ./mvnw test -Dtest=OpenApiExportTest

      - name: Generate TypeScript Angular API Client
        run: |
          pnpm dlx @openapitools/openapi-generator-cli generate \
            -i target/openapi.json \
            -g typescript-angular \
            -o client \
            --additional-properties=providedInRoot=true,serviceSuffix=ApiService,apiModulePrefix=Neversion,npmName=@alexandercanon/api-client

      - name: Install dependencies and build Angular library with pnpm
        working-directory: client
        run: |
          pnpm add tslib
          pnpm install
          pnpm run build

      - name: Publish to GitHub Packages
        working-directory: client/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            pnpm version ${{ github.event.inputs.version }} --no-git-tag-version --allow-same-version
          fi
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm config set @alexandercanon:registry https://npm.pkg.github.com
          pnpm publish --no-git-checks
