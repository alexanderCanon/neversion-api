name: Publish TypeScript API Client to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@alexandercanon'

      - name: Generate OpenAPI Specification
        run: ./mvnw test -Dtest=OpenApiExportTest

      - name: Install OpenAPI Generator CLI
        run: npm install -g @openapitools/openapi-generator-cli

      - name: Generate TypeScript Angular API Client
        run: |
          openapi-generator-cli generate \
            -i target/openapi.json \
            -g typescript-angular \
            -o client \
            --additional-properties=providedInRoot=true,serviceSuffix=ApiService,apiModulePrefix=Neversion,npmName=@alexandercanon/api-client

      - name: Configure and Publish to GitHub Packages
        working-directory: client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            npm version ${{ github.event.inputs.version }} --no-git-tag-version --allow-same-version
          fi
          npm publish --access restricted
