name: Publish TypeScript API Clients to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
      client:
        description: 'Client to build & publish'
        required: true
        type: choice
        options:
          - 'all'
          - 'fetch'
          - 'angular'
        default: 'all'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Clients
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Generate OpenAPI Specification
        run: ./mvnw test -Dtest=OpenApiExportTest

      - name: Determine Package Version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------
      # 1. Fetch Client (@alexandercanon/api-client-fetch)
      # ----------------------------------------------------
      - name: Build & Publish TypeScript Fetch Client
        if: ${{ github.event_name == 'push' || github.event.inputs.client == 'all' || github.event.inputs.client == 'fetch' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          pnpm dlx @openapitools/openapi-generator-cli generate \
            -i target/openapi.json \
            -g typescript-fetch \
            -o client-fetch \
            --additional-properties=npmName=@alexandercanon/api-client-fetch,supportsES6=true,typescriptThreePlus=true

          cd client-fetch
          pnpm version "$PKG_VERSION" --no-git-tag-version --allow-same-version
          pnpm install --ignore-scripts
          pnpm run build
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm config set @alexandercanon:registry https://npm.pkg.github.com
          pnpm publish --no-git-checks

      # ----------------------------------------------------
      # 2. Angular Client (@alexandercanon/api-client-angular)
      # ----------------------------------------------------
      - name: Build & Publish TypeScript Angular Client
        if: ${{ github.event_name == 'push' || github.event.inputs.client == 'all' || github.event.inputs.client == 'angular' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          pnpm dlx @openapitools/openapi-generator-cli generate \
            -i target/openapi.json \
            -g typescript-angular \
            -o client-angular \
            --additional-properties=providedInRoot=true,serviceSuffix=ApiService,apiModulePrefix=Neversion,npmName=@alexandercanon/api-client-angular

          cd client-angular
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            delete pkg.scripts.prepare;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          pnpm add tslib --ignore-scripts
          pnpm run build
          cd dist
          pnpm version "$PKG_VERSION" --no-git-tag-version --allow-same-version
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm config set @alexandercanon:registry https://npm.pkg.github.com
          pnpm publish --no-git-checks
