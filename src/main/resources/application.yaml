spring:
  application:
    name: panel
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    execute-in-transaction: false
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.neversion.panel.config: DEBUG

supabase:
  jwt:
    secret: ${SUPABASE_JWT_SECRET}
